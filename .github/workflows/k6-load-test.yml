name: K6 Load Test (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: grafana/k6:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 script
        run: k6 run k6-tests/basic-test.js
